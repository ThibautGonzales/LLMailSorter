# LLMailSorter: n8n running locally.
# Usage: `cp .env.example .env` (then fill it in), then `docker compose up -d`.

services:
  n8n:
    # Pinned version (not `latest`) so exported workflows stay reproducible.
    image: n8nio/n8n:2.47.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # reachable from this machine only
    environment:
      # Key used to encrypt credentials (Gmail OAuth, LLM API keys) in the database.
      # If it changes or is lost, stored credentials can no longer be decrypted.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Base URL used to build the OAuth redirect address given to Google.
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Listen on IPv4: avoids a startup crash on hosts without IPv6.
      N8N_LISTEN_ADDRESS: 0.0.0.0
      # Prefer IPv4 for outgoing calls: Microsoft Graph also resolves to IPv6
      # addresses, which fail with ENETUNREACH when Docker has no IPv6 route.
      NODE_OPTIONS: --dns-result-order=ipv4first
    # Public DNS servers: the default Docker/Windows resolver returns a bloated
    # answer for login.microsoftonline.com in which the IPv4 addresses get lost,
    # so Microsoft OAuth token refreshes fail with ENETUNREACH.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # n8n keeps its data (workflows, encrypted credentials, executions) in its
    # default SQLite database, stored in this volume.
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
